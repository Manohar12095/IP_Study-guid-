<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Programming – 16 Mark Study Guide</title>
<meta name="description" content="Exam-ready 16 mark answers for Internet Programming, Units 1 to 5.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Toggle menu">&#9776;</button>
  <div class="brand">
    <span class="brand-title">Internet Programming</span>
    <span class="brand-sub">16 Mark Study Guide</span>
  </div>
  <div class="top-actions">
    <input id="search" type="search" placeholder="Search questions or topics..." aria-label="Search">
    <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">&#9788;</button>
  </div>
</header>

<div class="progress-wrap"><div id="progressBar"></div></div>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="side-stat"><strong id="doneCount">0</strong> / <span id="totalCount">0</span> completed</div>
      <button id="resetBtn" class="link-btn">Reset progress</button>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main id="content" class="content">
    <section id="home"></section>
    <article id="question" class="hidden"></article>
  </main>
</div>

<div id="overlay" class="overlay hidden"></div>

<script src="helpers.js"></script>
<script src="unit1.js"></script>
<script src="unit2.js"></script>
<script src="unit3.js"></script>
<script src="unit4.js"></script>
<script src="unit5.js"></script>
<script src="app.js"></script>
</body>
</html>
